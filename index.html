<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Talk AI</title>

    <style>
        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }


        /* =========================================
           CINEMATIC SPLASH SCREEN
        ========================================= */

        .splash {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.08) 0%,
                    rgba(20,20,20,0.6) 25%,
                    #000 70%
                );

            overflow: hidden;
            z-index: 100;
        }


        /* Cinematic center glow */

        .splash::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background: rgba(255,255,255,0.035);

            filter: blur(45px);

            animation: centerGlow 3s ease-in-out infinite;
        }


        @keyframes centerGlow {

            0% {
                transform: scale(0.6);
                opacity: 0.2;
            }

            50% {
                transform: scale(1.35);
                opacity: 0.9;
            }

            100% {
                transform: scale(0.6);
                opacity: 0.2;
            }
        }


        /* =========================================
           PUZZLE CONTAINER
        ========================================= */

        .puzzle-container {
            position: relative;

            width: 220px;
            height: 220px;

            z-index: 5;
        }


        /* =========================================
           PUZZLE PIECES
        ========================================= */

        .piece {
            position: absolute;

            width: 82px;
            height: 82px;

            background: #fff;

            opacity: 0;

            box-shadow:
                0 0 15px rgba(255,255,255,0.15),
                0 0 40px rgba(255,255,255,0.08);
        }


        /* TOP */

        .piece.top {
            left: 69px;
            top: -150px;

            animation:
                topPiece
                1.15s
                cubic-bezier(.16,1,.3,1)
                .2s
                forwards;
        }


        /* RIGHT */

        .piece.right {
            right: -150px;
            top: 69px;

            animation:
                rightPiece
                1.15s
                cubic-bezier(.16,1,.3,1)
                .35s
                forwards;
        }


        /* BOTTOM */

        .piece.bottom {
            left: 69px;
            bottom: -150px;

            animation:
                bottomPiece
                1.15s
                cubic-bezier(.16,1,.3,1)
                .5s
                forwards;
        }


        /* LEFT */

        .piece.left {
            left: -150px;
            top: 69px;

            animation:
                leftPiece
                1.15s
                cubic-bezier(.16,1,.3,1)
                .65s
                forwards;
        }


        /* =========================================
           PIECE ANIMATIONS
        ========================================= */

        @keyframes topPiece {

            0% {
                opacity: 0;
                transform:
                    translateY(-100px)
                    rotate(-30deg);
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 1;
                transform:
                    translateY(69px)
                    rotate(0deg);
            }
        }


        @keyframes rightPiece {

            0% {
                opacity: 0;
                transform:
                    translateX(100px)
                    rotate(30deg);
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 1;
                transform:
                    translateX(-69px)
                    rotate(0deg);
            }
        }


        @keyframes bottomPiece {

            0% {
                opacity: 0;
                transform:
                    translateY(100px)
                    rotate(30deg);
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 1;
                transform:
                    translateY(-69px)
                    rotate(0deg);
            }
        }


        @keyframes leftPiece {

            0% {
                opacity: 0;
                transform:
                    translateX(-100px)
                    rotate(-30deg);
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 1;
                transform:
                    translateX(69px)
                    rotate(0deg);
            }
        }


        /* =========================================
           CENTER LOCK FLASH
        ========================================= */

        .lock-flash {
            position: absolute;

            width: 16px;
            height: 16px;

            left: 50%;
            top: 50%;

            border-radius: 50%;

            background: #fff;

            transform:
                translate(-50%, -50%)
                scale(0);

            opacity: 0;

            box-shadow:
                0 0 20px #fff,
                0 0 60px rgba(255,255,255,0.8);

            animation:
                lockFlash
                .75s
                ease
                1.75s
                forwards;
        }


        @keyframes lockFlash {

            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0);

                opacity: 0;
            }

            35% {
                transform:
                    translate(-50%, -50%)
                    scale(5);

                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(0);

                opacity: 0;
            }
        }


        /* =========================================
           LONG RECTANGLE
        ========================================= */

        .logo-box {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 0;
            height: 58px;

            display: flex;

            overflow: hidden;

            transform:
                translate(-50%, -50%);

            opacity: 0;

            z-index: 8;

            animation:
                boxAppear
                .8s
                cubic-bezier(.16,1,.3,1)
                2.15s
                forwards;
        }


        .logo-half {
            width: 50%;
            height: 100%;

            background: #fff;

            position: relative;
        }


        .left-half {
            transform: translateX(100%);

            animation:
                openLeft
                .8s
                cubic-bezier(.77,0,.18,1)
                2.95s
                forwards;
        }


        .right-half {
            transform: translateX(-100%);

            animation:
                openRight
                .8s
                cubic-bezier(.77,0,.18,1)
                2.95s
                forwards;
        }


        @keyframes boxAppear {

            0% {
                width: 0;
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                width: 270px;
                opacity: 1;
            }
        }


        @keyframes openLeft {

            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-100%);
            }
        }


        @keyframes openRight {

            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(100%);
            }
        }


        /* =========================================
           TALK AI LOGO
        ========================================= */

        .brand {
            position: absolute;

            left: 50%;
            top: 50%;

            color: #fff;

            font-size:
                clamp(38px, 12vw, 72px);

            font-weight: 800;

            letter-spacing: 7px;

            white-space: nowrap;

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(.5);

            text-shadow:
                0 0 10px rgba(255,255,255,.55),
                0 0 30px rgba(255,255,255,.25);

            z-index: 10;

            animation:
                brandReveal
                1.1s
                cubic-bezier(.16,1,.3,1)
                3.4s
                forwards;
        }


        @keyframes brandReveal {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(.45);

                letter-spacing: 25px;

                filter: blur(15px);
            }

            55% {
                opacity: 1;
            }

            100% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);

                letter-spacing: 6px;

                filter: blur(0);
            }
        }


        /* =========================================
           PARTICLES
        ========================================= */

        .particles {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }


        .particle {
            position: absolute;

            width: 2px;
            height: 2px;

            background: #fff;

            border-radius: 50%;

            opacity: 0;
        }


        .p1 {
            left: 12%;
            top: 25%;
            animation: particleMove 1.6s 1.8s forwards;
        }

        .p2 {
            left: 25%;
            top: 70%;
            animation: particleMove 1.6s 1.9s forwards;
        }

        .p3 {
            left: 78%;
            top: 25%;
            animation: particleMove 1.6s 2s forwards;
        }

        .p4 {
            left: 88%;
            top: 72%;
            animation: particleMove 1.6s 2.1s forwards;
        }

        .p5 {
            left: 40%;
            top: 12%;
            animation: particleMove 1.6s 2.2s forwards;
        }

        .p6 {
            left: 62%;
            top: 88%;
            animation: particleMove 1.6s 2.3s forwards;
        }

        .p7 {
            left: 8%;
            top: 82%;
            animation: particleMove 1.6s 2.4s forwards;
        }

        .p8 {
            left: 92%;
            top: 18%;
            animation: particleMove 1.6s 2.5s forwards;
        }


        @keyframes particleMove {

            0% {
                opacity: 0;
                transform: scale(.3);
            }

            30% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform:
                    scale(2)
                    translate(
                        0,
                        -30px
                    );
            }
        }


        /* =========================================
           WELCOME SCREEN
        ========================================= */

        .welcome {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #181818 0%,
                    #080808 45%,
                    #000 100%
                );

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 1s ease,
                visibility 1s ease;

            z-index: 10;
        }


        .welcome.show {
            opacity: 1;
            visibility: visible;
        }


        .welcome-content {
            width: 100%;
            max-width: 430px;

            text-align: center;

            animation:
                welcomeUp
                1s
                cubic-bezier(.16,1,.3,1);
        }


        @keyframes welcomeUp {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================
           WELCOME LOGO
        ========================================= */

        .welcome-logo {
            color: #fff;

            font-size:
                clamp(48px, 15vw, 78px);

            font-weight: 900;

            letter-spacing: -4px;

            margin-bottom: 12px;
        }


        .welcome-logo span {
            font-weight: 400;
        }


        /* =========================================
           WELCOME DESCRIPTION
        ========================================= */

        .welcome-subtitle {
            color: #999;

            font-size: 15px;

            line-height: 1.65;

            max-width: 350px;

            margin:
                0 auto 42px;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .btn {
            width: 100%;

            min-height: 58px;

            border-radius: 17px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;
        }


        .btn:active {
            transform: scale(.97);
        }


        /* CREATE ACCOUNT */

        .create-btn {
            border: none;

            background: #fff;

            color: #000;

            box-shadow:
                0 10px 35px rgba(255,255,255,.08);
        }


        .create-btn:hover {
            box-shadow:
                0 10px 45px rgba(255,255,255,.2);
        }


        /* LOGIN */

        .login-btn {
            border: 1px solid #333;

            background:
                rgba(255,255,255,.025);

            color: #fff;
        }


        .login-btn:hover {
            background:
                rgba(255,255,255,.08);
        }


        /* =========================================
           BOTTOM TEXT
        ========================================= */

        .bottom-text {
            margin-top: 30px;

            color: #555;

            font-size: 12px;

            letter-spacing: .4px;
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .puzzle-container {
                transform: scale(.85);
            }

            .brand {
                font-size: 34px;
            }

            .welcome {
                padding: 20px;
            }

            .welcome-subtitle {
                font-size: 14px;
            }
        }


        /* =========================================
           LANDSCAPE PHONES
        ========================================= */

        @media (max-height: 550px) {

            .welcome-content {
                transform: scale(.8);
            }
        }
    </style>
</head>


<body>


    <!-- =========================================
         CINEMATIC INTRO
    ========================================== -->

    <section class="splash" id="splash">

        <div class="puzzle-container">

            <div class="piece top"></div>

            <div class="piece right"></div>

            <div class="piece bottom"></div>

            <div class="piece left"></div>

            <div class="lock-flash"></div>

        </div>


        <!-- Rectangle that opens -->

        <div class="logo-box">

            <div class="logo-half left-half"></div>

            <div class="logo-half right-half"></div>

        </div>


        <!-- Talk AI -->

        <div class="brand">
            Talk AI
        </div>


        <!-- Particles -->

        <div class="particles">

            <span class="particle p1"></span>

            <span class="particle p2"></span>

            <span class="particle p3"></span>

            <span class="particle p4"></span>

            <span class="particle p5"></span>

            <span class="particle p6"></span>

            <span class="particle p7"></span>

            <span class="particle p8"></span>

        </div>

    </section>



    <!-- =========================================
         WELCOME PAGE
    ========================================== -->

    <section class="welcome" id="welcome">

        <div class="welcome-content">


            <!-- Logo -->

            <div class="welcome-logo">
                Talk<span>AI</span>
            </div>


            <!-- Description -->

            <p class="welcome-subtitle">
                Your intelligent AI conversation starts here.
                Ask questions, explore ideas and get things done.
            </p>


            <!-- Buttons -->

            <div class="buttons">

                <button
                    class="btn create-btn"
                    onclick="window.location.href='register.html'">

                    Create an account

                </button>


                <button
                    class="btn login-btn"
                    onclick="window.location.href='login.html'">

                    Welcome back

                </button>

            </div>


            <!-- Bottom line -->

            <p class="bottom-text">
                Your AI. Your conversations. Your way.
            </p>


        </div>

    </section>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        const splash =
            document.getElementById("splash");

        const welcome =
            document.getElementById("welcome");


        /*
         * Begin transition after
         * the Talk AI animation.
         */

        setTimeout(() => {

            splash.style.transition =
                "opacity 1s ease, transform 1s ease";

            splash.style.opacity = "0";

            splash.style.transform =
                "scale(1.04)";

        }, 4800);


        /*
         * Completely remove splash
         * and reveal welcome page.
         */

        setTimeout(() => {

            splash.style.display = "none";

            welcome.classList.add("show");

        }, 5700);

    </script>

</body>
</html>
